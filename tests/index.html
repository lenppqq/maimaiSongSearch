<!doctype html>
<meta charset="utf-8">
<title>engine tests</title>
<pre id="out" style="font: 13px/1.4 ui-monospace, monospace; padding: 12px"></pre>
<script type="module">
  import { run } from './engine.test.mjs';
  const out = document.getElementById('out');
  const failed = await run(async () => (await fetch('../site/data/songs.json')).json(), (line) => { out.textContent += line + '\n'; });
  document.title = failed ? 'FAIL' : 'PASS';
</script>
